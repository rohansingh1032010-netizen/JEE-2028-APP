<script>

/* =========================
   JEE CLASS 11 CHAPTERS
========================= */

const chapters = {

Physics: [
"Units and Measurements",
"Mathematical Tools",
"Motion in a Straight Line",
"Motion in a Plane",
"Laws of Motion",
"Work, Energy and Power",
"System of Particles and Rotational Motion",
"Gravitation",
"Mechanical Properties of Solids",
"Mechanical Properties of Fluids",
"Thermal Properties of Matter",
"Thermodynamics",
"Kinetic Theory",
"Oscillations",
"Waves"
],

Chemistry: [
"Some Basic Concepts of Chemistry",
"Structure of Atom",
"Classification of Elements and Periodicity",
"Chemical Bonding and Molecular Structure",
"States of Matter",
"Thermodynamics",
"Equilibrium",
"Redox Reactions",
"Hydrogen",
"The s-Block Elements",
"Organic Chemistry – Basic Principles",
"Hydrocarbons",
"Environmental Chemistry"
],

Mathematics: [
"Sets",
"Relations and Functions",
"Trigonometric Functions",
"Complex Numbers and Quadratic Equations",
"Linear Inequalities",
"Permutations and Combinations",
"Binomial Theorem",
"Sequences and Series",
"Straight Lines",
"Conic Sections",
"Introduction to Three Dimensional Geometry",
"Limits and Derivatives",
"Statistics",
"Probability"
]
};


/* =========================
   DATA
========================= */

let data = JSON.parse(localStorage.getItem("jeeApp")) || {

target:"",
streak:0,
lastStudy:"",
xp:0,

subjects:{
phy:0,
chem:0,
math:0
},

backlog:{
phy:50,
chem:80,
math:75,
daily:3
},

questions:{
attempted:0,
correct:0,
wrong:0
},

chapterProgress:{},

revisions:[],

dark:false
};


/* =========================
   SAVE
========================= */

function save(){

localStorage.setItem(
"jeeApp",
JSON.stringify(data)
);

updateUI();

}


/* =========================
   CHAPTER DROPDOWN
========================= */

function loadChapters(){

let subject =
document.getElementById("chapterSubject").value;

let dropdown =
document.getElementById("chapterName");

dropdown.innerHTML =
'<option value="">Select Chapter</option>';

if(!subject)return;

chapters[subject].forEach(chapter=>{

let option =
document.createElement("option");

option.value=chapter;
option.textContent=chapter;

dropdown.appendChild(option);

});

}


/* =========================
   ADD / UPDATE CHAPTER
========================= */

function addChapter(){

let subject =
document.getElementById("chapterSubject").value;

let chapter =
document.getElementById("chapterName").value;

let status =
document.getElementById("chapterStatus").value;

if(!subject || !chapter){

alert("Pehle subject aur chapter select karo.");

return;

}

if(!data.chapterProgress[subject]){
data.chapterProgress[subject]={};
}

data.chapterProgress[subject][chapter]=status;

data.xp+=5;

save();

alert(
"✅ "+chapter+
" → "+status
);

}


/* =========================
   SHOW ALL CHAPTERS
========================= */

function showChapters(){

let box =
document.getElementById("allChapters");

box.innerHTML="";

Object.keys(chapters).forEach(subject=>{

let html=
`<div class="subject">
<h3>${subject}</h3>`;

chapters[subject].forEach(chapter=>{

let status =
data.chapterProgress?.[subject]?.[chapter]
|| "Not Started";

html+=`
<div style="
display:flex;
justify-content:space-between;
padding:8px 0;
border-bottom:1px solid #ddd;
">

<span>${chapter}</span>

<span class="badge">
${status}
</span>

</div>
`;

});

html+="</div>";

box.innerHTML+=html;

});

}


/* =========================
   TARGET
========================= */

function saveTarget(){

data.target =
document.getElementById("target").value;

save();

}


/* =========================
   STUDY STREAK
========================= */

function studyToday(){

let today =
new Date().toDateString();

if(data.lastStudy!==today){

data.streak++;

data.lastStudy=today;

data.xp+=20;

save();

alert(
"🔥 Today's study recorded! +20 XP"
);

}else{

alert(
"Bhai, aaj already recorded hai 😎"
);

}

}


/* =========================
   SUBJECT PROGRESS
========================= */

function saveSubjects(){

data.subjects.phy =
Math.min(
100,
+document.getElementById("phy").value || 0
);

data.subjects.chem =
Math.min(
100,
+document.getElementById("chem").value || 0
);

data.subjects.math =
Math.min(
100,
+document.getElementById("math").value || 0
);

data.xp+=10;

save();

}


/* =========================
   BACKLOG
========================= */

function saveBacklog(){

data.backlog.phy =
+document.getElementById("phyBacklog").value || 0;

data.backlog.chem =
+document.getElementById("chemBacklog").value || 0;

data.backlog.math =
+document.getElementById("mathBacklog").value || 0;

data.backlog.daily =
+document.getElementById("dailyLectures").value || 1;

let total =
data.backlog.phy+
data.backlog.chem+
data.backlog.math;

let days =
Math.ceil(
total/data.backlog.daily
);

document.getElementById("backlogResult").innerText=

"📦 Total Backlog: "+
total+
" lectures | Approx. "+
days+
" days";

save();

}


/* =========================
   QUESTION TRACKER
========================= */

function saveQuestions(){

data.questions.attempted =
+document.getElementById("attempted").value || 0;

data.questions.correct =
+document.getElementById("correct").value || 0;

data.questions.wrong =
+document.getElementById("wrong").value || 0;

data.xp+=
Math.min(
50,
data.questions.correct
);

save();

}


/* =========================
   REVISION
========================= */

function addRevision(){

let chapter =
document.getElementById("revisionChapter").value;

let date =
document.getElementById("revisionDate").value;

if(!chapter || !date)return;

data.revisions.push({
chapter:chapter,
date:date
});

data.xp+=5;

save();

}


/* =========================
   SMART PLANNER
========================= */

function makePlan(){

let hours =
+document.getElementById("studyHours").value || 6;

let questions =
+document.getElementById("plannerQuestions").value || 60;

let lecture =
Math.round(hours*.5*10)/10;

let revision =
Math.round(hours*.25*10)/10;

let practice =
Math.round(hours*.25*10)/10;

document.getElementById("plan").innerHTML=`

<div class="subject">

<h3>📅 Today's Smart Plan</h3>

<p>🎥 Lectures:
<b>${lecture} hours</b>
</p>

<p>🔄 Revision:
<b>${revision} hours</b>
</p>

<p>📝 Question Practice:
<b>${practice} hours</b>
</p>

<p>🎯 Questions:
<b>${questions}</b>
</p>

</div>

`;

}


/* =========================
   TIMER
========================= */

let timerSeconds=1500;
let timerInterval=null;

function showTimer(){

let m=
Math.floor(timerSeconds/60);

let s=
timerSeconds%60;

document.getElementById("timer").innerText=

String(m).padStart(2,"0")
+
":"
+
String(s).padStart(2,"0");

}


function startTimer(){

if(timerInterval)return;

timerInterval=setInterval(()=>{

if(timerSeconds>0){

timerSeconds--;

showTimer();

}else{

clearInterval(timerInterval);

timerInterval=null;

data.xp+=25;

save();

alert(
"🔥 Focus session complete! +25 XP"
);

}

},1000);

}


function pauseTimer(){

clearInterval(timerInterval);

timerInterval=null;

}


function resetTimer(){

pauseTimer();

timerSeconds=1500;

showTimer();

}


/* =========================
   DARK MODE
========================= */

function toggleDark(){

data.dark=!data.dark;

document.body.classList.toggle(
"dark",
data.dark
);

save();

}


/* =========================
   BACKUP
========================= */

function exportData(){

let blob =
new Blob(
[JSON.stringify(data,null,2)],
{type:"application/json"}
);

let a =
document.createElement("a");

a.href=
URL.createObjectURL(blob);

a.download=
"jee-backup.json";

a.click();

}


function importData(){

document
.getElementById("fileInput")
.click();

}


document
.getElementById("fileInput")
.addEventListener(
"change",
function(e){

let file=e.target.files[0];

if(!file)return;

let reader=
new FileReader();

reader.onload=function(){

try{

data=
JSON.parse(
reader.result
);

save();

alert(
"✅ Backup imported!"
);

}catch{

alert(
"❌ Invalid backup file"
);

}

};

reader.readAsText(file);

}
);


/* =========================
   MAIN UI
========================= */

function updateUI(){

document.getElementById("target").value=
data.target;

document.getElementById("targetShow").innerText=
data.target
?
"🎯 Target: "+data.target
:
"No target set";


document.getElementById("streak").innerText=
data.streak+" 🔥";


document.getElementById("level").innerText=
Math.floor(data.xp/100)+1;


document.getElementById("xp").innerText=
data.xp;


document.getElementById("xpBar").style.width=
(data.xp%100)+"%";


document.getElementById("phy").value=
data.subjects.phy;

document.getElementById("chem").value=
data.subjects.chem;

document.getElementById("math").value=
data.subjects.math;


document.getElementById("phyBar").style.width=
data.subjects.phy+"%";

document.getElementById("chemBar").style.width=
data.subjects.chem+"%";

document.getElementById("mathBar").style.width=
data.subjects.math+"%";


document.getElementById("phyBacklog").value=
data.backlog.phy;

document.getElementById("chemBacklog").value=
data.backlog.chem;

document.getElementById("mathBacklog").value=
data.backlog.math;

document.getElementById("dailyLectures").value=
data.backlog.daily;


document.getElementById("attempted").value=
data.questions.attempted;

document.getElementById("correct").value=
data.questions.correct;

document.getElementById("wrong").value=
data.questions.wrong;


document.getElementById("attemptedShow").innerText=
data.questions.attempted;


let accuracy=
data.questions.attempted
?
Math.round(
data.questions.correct/
data.questions.attempted*
100
)
:
0;


document.getElementById("accuracy").innerText=
accuracy;


/* READINESS */

let avg=
(
data.subjects.phy+
data.subjects.chem+
data.subjects.math
)/3;

let readiness=
Math.round(
avg*.6+
Math.min(accuracy,100)*.2+
Math.min(data.streak*2,20)
);

readiness=
Math.min(100,readiness);


document.getElementById("readiness").innerText=
readiness;

document.getElementById("readinessBar").style.width=
readiness+"%";


/* REVISIONS */

let rev=
document.getElementById("revisionList");

rev.innerHTML="";

data.revisions.forEach(r=>{

rev.innerHTML+=`

<div class="subject">

🔄 <b>${r.chapter}</b>

<br>

Next Revision:
${r.date}

</div>

`;

});


/* ACHIEVEMENTS */

let achievements=[];

if(data.streak>=7)
achievements.push("🔥 7 Day Streak");

if(data.questions.attempted>=100)
achievements.push("📝 100 Questions");

if(data.xp>=500)
achievements.push("🏆 500 XP");

if(
data.subjects.phy>=50 &&
data.subjects.chem>=50 &&
data.subjects.math>=50
)
achievements.push("📚 50% Syllabus");


if(!achievements.length)
achievements.push(
"🎯 Keep studying to unlock achievements!"
);


document.getElementById("achievements").innerHTML=

achievements
.map(
x=>`<span class="badge">${x}</span>`
)
.join("");


document.body.classList.toggle(
"dark",
data.dark
);


showChapters();

}


/* =========================
   START
========================= */

updateUI();

showTimer();

</script>
