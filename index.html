<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEE 2028 Command Center</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  background:#f4f7fb;
  color:#172033;
  transition:.3s;
}

body.dark{
  background:#0d1422;
  color:#f5f7ff;
}

header{
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:white;
  padding:30px 15px;
  text-align:center;
}

header h1{
  font-size:30px;
  margin-bottom:8px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 5px 20px #00000012;
}

.dark .card{
  background:#172033;
}

h2{
  margin-bottom:15px;
}

input,select,button{
  font:inherit;
}

input[type="text"]{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-bottom:15px;
}

.dark input[type="text"]{
  background:#0d1422;
  color:white;
  border-color:#334155;
}

.subject{
  margin-top:25px;
}

.subject-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.progress{
  height:10px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:15px;
}

.progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#2563eb,#7c3aed);
  transition:.3s;
}

.chapter{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  border:1px solid #e5e7eb;
  border-radius:10px;
  margin:7px 0;
  transition:.2s;
}

.dark .chapter{
  border-color:#334155;
}

.chapter:hover{
  transform:translateX(3px);
}

.chapter input{
  width:18px;
  height:18px;
}

.chapter-name{
  flex:1;
  font-weight:600;
}

.status{
  padding:7px 8px;
  border-radius:8px;
  border:none;
  cursor:pointer;
  font-weight:bold;
}

.status.not-started{
  background:#fee2e2;
  color:#b91c1c;
}

.status.learning{
  background:#fef3c7;
  color:#92400e;
}

.status.strong{
  background:#dcfce7;
  color:#166534;
}

.bulk{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:15px;
}

.bulk button{
  border:none;
  padding:10px 14px;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
}

.btn-red{
  background:#fee2e2;
  color:#b91c1c;
}

.btn-yellow{
  background:#fef3c7;
  color:#92400e;
}

.btn-green{
  background:#dcfce7;
  color:#166534;
}

.btn-blue{
  background:#dbeafe;
  color:#1d4ed8;
}

.topbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.topbar button{
  padding:10px 15px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#2563eb;
  color:white;
  font-weight:bold;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
}

.stat{
  padding:18px;
  border-radius:14px;
  background:linear-gradient(135deg,#eff6ff,#f5f3ff);
}

.dark .stat{
  background:#202b40;
}

.stat h3{
  font-size:14px;
  opacity:.7;
  margin-bottom:8px;
}

.stat p{
  font-size:25px;
  font-weight:bold;
}

.hidden{
  display:none;
}

@media(max-width:600px){
  .container{
    padding:12px;
  }

  header h1{
    font-size:24px;
  }

  .chapter{
    align-items:flex-start;
  }

  .status{
    font-size:12px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🚀 JEE 2028 Command Center</h1>
  <p>Track your JEE preparation chapter by chapter</p>
</header>

<div class="container">

  <div class="topbar">
    <button onclick="toggleDark()">🌙 Dark Mode</button>
    <button onclick="selectAllVisible()">☑️ Select All</button>
    <button onclick="clearSelection()">❌ Clear Selection</button>
  </div>

  <div class="card">
    <h2>📊 Overall Progress</h2>

    <div class="stats">
      <div class="stat">
        <h3>Total Chapters</h3>
        <p id="total">0</p>
      </div>

      <div class="stat">
        <h3>Not Started</h3>
        <p id="notStarted">0</p>
      </div>

      <div class="stat">
        <h3>Learning</h3>
        <p id="learning">0</p>
      </div>

      <div class="stat">
        <h3>Strong</h3>
        <p id="strong">0</p>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>📚 Chapter Tracker</h2>

    <input
      type="text"
      id="search"
      placeholder="🔎 Search chapter..."
      oninput="renderChapters()"
    >

    <div class="bulk">
      <button class="btn-red" onclick="bulkStatus('Not Started')">
        🔴 Set Not Started
      </button>

      <button class="btn-yellow" onclick="bulkStatus('Learning')">
        🟡 Set Learning
      </button>

      <button class="btn-green" onclick="bulkStatus('Strong')">
        🟢 Set Strong
      </button>
    </div>

    <p style="margin-bottom:15px;">
      Selected: <b id="selectedCount">0</b>
    </p>

    <div id="chapters"></div>
  </div>

</div>

<script>

const subjects = {

Physics:[
"Units and Measurements",
"Motion in a Straight Line",
"Motion in a Plane",
"Laws of Motion",
"Work, Energy and Power",
"System of Particles and Rotational Motion",
"Gravitation",
"Mechanical Properties of Solids",
"Mechanical Properties of Fluids",
"Thermal Properties of Matter",
"Thermodynamics",
"Kinetic Theory",
"Oscillations",
"Waves",
"Properties of Bulk Matter"
],

Chemistry:[
"Some Basic Concepts of Chemistry",
"Structure of Atom",
"Classification of Elements",
"Chemical Bonding",
"Thermodynamics",
"Equilibrium",
"Redox Reactions",
"Organic Chemistry – Basic Principles",
"Hydrocarbons",
"States of Matter",
"Periodic Table",
"Hydrogen",
"Environmental Chemistry"
],

Mathematics:[
"Sets",
"Relations and Functions",
"Trigonometric Functions",
"Complex Numbers",
"Linear Inequalities",
"Permutations and Combinations",
"Binomial Theorem",
"Sequences and Series",
"Straight Lines",
"Conic Sections",
"Introduction to Three Dimensional Geometry",
"Limits and Derivatives",
"Statistics",
"Probability"
]

};


/* =========================
   LOAD SAVED DATA
========================= */

let saved = localStorage.getItem("jeeChapterTracker");

let data = saved ? JSON.parse(saved) : {};

for(const subject in subjects){

  if(!data[subject]){
    data[subject] = {};
  }

  subjects[subject].forEach(chapter => {

    if(!data[subject][chapter]){
      data[subject][chapter] = "Not Started";
    }

  });

}


/* =========================
   SAVE
========================= */

function save(){

  localStorage.setItem(
    "jeeChapterTracker",
    JSON.stringify(data)
  );

}


/* =========================
   SELECTED CHAPTERS
========================= */

let selected = new Set();


/* =========================
   RENDER
========================= */

function renderChapters(){

  const box = document.getElementById("chapters");

  const search =
    document.getElementById("search").value.toLowerCase();

  box.innerHTML = "";

  for(const subject in subjects){

    const filtered = subjects[subject].filter(chapter =>
      chapter.toLowerCase().includes(search)
    );

    if(filtered.length === 0) continue;

    const section = document.createElement("div");

    section.className = "subject";

    let html = `
      <div class="subject-title">
        <h2>${subject}</h2>
        <span id="${subject}Percent">0%</span>
      </div>

      <div class="progress">
        <div
          class="progress-bar"
          id="${subject}Bar">
        </div>
      </div>
    `;

    filtered.forEach(chapter => {

      const status = data[subject][chapter];

      const id =
        subject + "_" +
        chapter.replace(/[^a-zA-Z0-9]/g,"_");

      html += `

        <div class="chapter">

          <input
            type="checkbox"
            class="chapterCheck"
            data-subject="${escapeAttr(subject)}"
            data-chapter="${escapeAttr(chapter)}"
            ${selected.has(subject+"|||"+chapter) ? "checked" : ""}
            onchange="toggleSelect(
              '${escapeJS(subject)}',
              '${escapeJS(chapter)}'
            )"
          >

          <span class="chapter-name">
            ${chapter}
          </span>

          <select
            class="status ${statusClass(status)}"
            onchange="
              changeStatus(
                '${escapeJS(subject)}',
                '${escapeJS(chapter)}',
                this.value
              )
            "
          >

            <option value="Not Started"
              ${status==="Not Started"?"selected":""}>
              🔴 Not Started
            </option>

            <option value="Learning"
              ${status==="Learning"?"selected":""}>
              🟡 Learning
            </option>

            <option value="Strong"
              ${status==="Strong"?"selected":""}>
              🟢 Strong
            </option>

          </select>

        </div>
      `;

    });

    section.innerHTML = html;

    box.appendChild(section);

    updateSubjectProgress(subject);

  }

  updateStats();

  document.getElementById("selectedCount").innerText =
    selected.size;

}


/* =========================
   CHANGE STATUS
========================= */

function changeStatus(subject,chapter,status){

  data[subject][chapter] = status;

  save();

  renderChapters();

}


/* =========================
   MULTIPLE SELECT
========================= */

function toggleSelect(subject,chapter){

  const key = subject + "|||" + chapter;

  if(selected.has(key)){
    selected.delete(key);
  }else{
    selected.add(key);
  }

  document.getElementById("selectedCount").innerText =
    selected.size;

}


/* =========================
   BULK STATUS
========================= */

function bulkStatus(status){

  if(selected.size === 0){

    alert("Pehle chapters select karo bhai 😄");

    return;

  }

  selected.forEach(key => {

    const parts = key.split("|||");

    const subject = parts[0];
    const chapter = parts.slice(1).join("|||");

    if(data[subject] && data[subject][chapter]){

      data[subject][chapter] = status;

    }

  });

  save();

  selected.clear();

  renderChapters();

}


/* =========================
   SELECT ALL
========================= */

function selectAllVisible(){

  const search =
    document.getElementById("search").value.toLowerCase();

  for(const subject in subjects){

    subjects[subject].forEach(chapter => {

      if(chapter.toLowerCase().includes(search)){

        selected.add(subject+"|||"+chapter);

      }

    });

  }

  renderChapters();

}


/* =========================
   CLEAR SELECTION
========================= */

function clearSelection(){

  selected.clear();

  renderChapters();

}


/* =========================
   SUBJECT PROGRESS
========================= */

function updateSubjectProgress(subject){

  const total = subjects[subject].length;

  let strong = 0;

  subjects[subject].forEach(chapter => {

    if(data[subject][chapter] === "Strong"){
      strong++;
    }

  });

  const percent =
    total === 0 ? 0 :
    Math.round((strong / total) * 100);

  const bar =
    document.getElementById(subject+"Bar");

  const text =
    document.getElementById(subject+"Percent");

  if(bar) bar.style.width = percent+"%";

  if(text) text.innerText = percent+"% Strong";

}


/* =========================
   OVERALL STATS
========================= */

function updateStats(){

  let total = 0;
  let notStarted = 0;
  let learning = 0;
  let strong = 0;

  for(const subject in subjects){

    subjects[subject].forEach(chapter => {

      total++;

      const status =
        data[subject][chapter];

      if(status === "Not Started"){
        notStarted++;
      }

      if(status === "Learning"){
        learning++;
      }

      if(status === "Strong"){
        strong++;
      }

    });

  }

  document.getElementById("total").innerText = total;

  document.getElementById("notStarted").innerText =
    notStarted;

  document.getElementById("learning").innerText =
    learning;

  document.getElementById("strong").innerText =
    strong;

}


/* =========================
   STATUS CLASS
========================= */

function statusClass(status){

  if(status === "Learning"){
    return "learning";
  }

  if(status === "Strong"){
    return "strong";
  }

  return "not-started";

}


/* =========================
   DARK MODE
========================= */

function toggleDark(){

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "jeeDarkMode",
    document.body.classList.contains("dark")
  );

}


/* =========================
   SECURITY HELPERS
========================= */

function escapeJS(str){

  return String(str)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");

}

function escapeAttr(str){

  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


/* =========================
   START
========================= */

if(localStorage.getItem("jeeDarkMode") === "true"){

  document.body.classList.add("dark");

}

renderChapters();

</script>

</body>
</html>
